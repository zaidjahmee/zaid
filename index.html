<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily inventory counts, sales totals, cash reconciliation, and employee shift tracking across multiple stores.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#171310">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/jetbrains-mono.css');

  :root{
    --ink:#171310;
    --paper:#f3ede2;
    --panel:#fffdf8;
    --line:#e4dbc8;
    --line-soft:#ede5d4;
    --muted:#8c8170;
    --accent:#b3401f;
    --accent-soft:#f0dcd0;
    --green:#3c8f7d;
    --green-deep:#153f37;
    --tobacco:#b23a2f;
    --grabba:#c99a1f;
    --grabba-deep:#4a3a05;
    --vapes:#a63d84;
    --good:#2f8f5b;
    --bad:#b3401f;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);}
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* subtle paper texture via layered gradients */
  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 14px 14px;
  }

  header{
    background:var(--ink);
    color:#f4ede0;
    padding:16px 16px 14px;
    position:sticky; top:0; z-index:30;
    box-shadow:0 3px 14px rgba(0,0,0,.18);
  }
  header .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{ display:flex; align-items:baseline; gap:8px;}
  .brand .mark{
    width:9px; height:9px; border-radius:2px; background:var(--accent);
    display:inline-block; transform:rotate(45deg); margin-right:2px;
  }
  header h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em;}
  header .sub{ font-size:11.5px; color:#a89e8c; margin-top:3px; font-family:var(--mono);}
  .head-controls{ display:flex; gap:6px; align-items:center;}
  .store-input{
    background:#2a241d; border:1px solid #3d362a; color:#f4ede0; border-radius:9px; padding:7px 9px;
    font-size:12.5px; width:64px; font-family:var(--mono); font-weight:600; text-align:center;
  }
  .store-input::placeholder{color:#6e6656;}
  .date-box{
    display:flex; align-items:center; background:#2a241d; border:1px solid #3d362a; border-radius:9px; padding:6px 9px;
  }
  .date-box input[type=date]{
    background:transparent; border:none; color:#f4ede0; font-size:12.5px; font-weight:600;
    font-family:var(--mono); padding:0;
  }
  .date-box input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.65;}

  .view-switch{
    display:flex; gap:2px; margin-top:12px; background:#221d17; border-radius:10px; padding:3px;
  }
  .view-switch button{
    flex:1; border:none; background:none; color:#a89e8c; font-family:var(--sans); font-weight:700;
    font-size:12.5px; padding:8px 0; border-radius:8px; cursor:pointer;
  }
  .view-switch button.active{ background:#3a3226; color:#f4ede0;}

  .store-tabs-wrap{ display:flex; align-items:center; gap:6px; margin-top:12px;}
  .store-tabs{ display:flex; gap:6px; overflow-x:auto; flex:1; scroll-behavior:smooth;}
  .store-chip{
    flex:none; padding:7px 13px; border-radius:9px; background:#2a241d; border:1px solid #3d362a;
    color:#c9c0ac; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--sans); white-space:nowrap;
  }
  .store-chip.active{ background:var(--accent); border-color:var(--accent); color:#fff2ec;}

  .day-tabs-wrap{ display:flex; align-items:center; gap:6px; margin-top:10px;}
  .day-nav{
    flex:none; width:28px; height:28px; border-radius:8px; background:#2a241d; border:1px solid #3d362a;
    color:#c9c0ac; font-size:15px; font-weight:700; cursor:pointer; font-family:var(--sans);
  }
  .day-nav:active{ background:#3d362a;}
  .day-tabs{ display:flex; gap:6px; overflow-x:auto; flex:1; scroll-behavior:smooth; padding:1px;}
  .day-chip{
    flex:none; min-width:42px; padding:6px 9px; border-radius:9px; background:#2a241d; border:1px solid #3d362a;
    color:#c9c0ac; font-family:var(--mono); font-size:12.5px; font-weight:700; cursor:pointer;
    position:relative; text-align:center;
  }
  .day-chip .dow{ display:block; font-size:8.5px; opacity:.7; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-family:var(--sans);}
  .day-chip.active{ background:var(--accent); border-color:var(--accent); color:#fff2ec;}
  .day-chip.has-data::after{
    content:''; position:absolute; top:5px; right:6px; width:5px; height:5px; border-radius:50%; background:#7be0af;
  }
  .day-chip.active.has-data::after{ background:#fff2ec;}
  .day-add{
    flex:none; background:#2a241d; border:1px dashed #4a4131; color:#c9c0ac; border-radius:8px; padding:6px 10px;
    font-size:11px; font-weight:700; cursor:pointer; font-family:var(--sans); white-space:nowrap;
  }
  .day-add:active{ border-color:var(--accent); color:var(--accent);}

  main{ max-width:900px; margin:0 auto; padding:14px 12px 70px;}

  /* search */
  .search-wrap{ position:relative; margin:2px 0 12px;}
  .search-wrap input{
    width:100%; padding:10px 12px 10px 34px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); font-size:14px; font-family:var(--sans);
  }
  .search-wrap input:focus{ outline:2px solid var(--accent); outline-offset:0;}
  .search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.4; font-size:14px;}
  .edit-prices-link{
    display:block; margin:-4px 0 12px; background:none; border:none; color:var(--muted);
    font-size:12px; font-weight:700; font-family:var(--sans); cursor:pointer; padding:0;
  }
  .edit-prices-link:hover{ color:var(--accent); }
  .price-edit-modal .share-card{ max-width:480px; max-height:80vh; display:flex; flex-direction:column; }
  .price-edit-list{ overflow-y:auto; margin:4px 0 10px; padding-right:2px; }
  .price-edit-cat{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    padding:10px 2px 4px; position:sticky; top:0; background:var(--panel);
  }
  .price-edit-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:6px 2px; border-top:1px solid var(--line-soft);
  }
  .price-edit-row .name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .price-edit-row input{
    width:90px; flex:none; border:1px solid var(--line); border-radius:7px; padding:6px 8px;
    text-align:right; font-size:13px; font-family:var(--mono); background:#fbf8f1;
  }
  .price-edit-row input:focus{ outline:2px solid var(--accent); outline-offset:0; background:#fff; }

  .tabs{
    display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px;
  }
  .tab{
    flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted);
    white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .tab .dot{ width:7px; height:7px; border-radius:2px; display:inline-block;}
  .tab.active{ background:var(--ink); color:#f4ede0; border-color:var(--ink);}
  .tab .tab-amt{ font-family:var(--mono); opacity:.75; font-size:11px;}
  .tab.tab-add{ border-style:dashed; color:var(--muted); }
  .tab.tab-add:hover{ border-color:var(--accent); color:var(--accent); }

  .cat-section{ margin-bottom:16px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:var(--panel);}
  .cat-head{
    padding:11px 14px; font-weight:800; font-size:12.5px; letter-spacing:.05em; text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center;
  }
  .cat-head .tot{ font-size:13.5px; font-weight:700; font-family:var(--mono);}
  /* Per-category background/text color is now applied inline (via cat.hex +
     contrastText()) since categories are user-extensible and can't all have
     a CSS class baked in ahead of time. */

  .item-row{
    display:grid;
    grid-template-columns: 1fr 54px 54px 54px 46px 68px;
    gap:5px;
    align-items:center;
    padding:8px 12px;
    border-top:1px solid var(--line);
    font-size:13px;
  }
  .item-row.head{
    font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;
    border-top:none; padding-bottom:5px; padding-top:10px;
  }
  /* Column divider lines. Uses box-shadow rather than border-left so it doesn't
     collide with the <input> cells' own `border` shorthand (which would otherwise
     win on specificity and silently erase a border-left rule here). */
  .item-row > *{ position:relative; }
  .item-row > *:not(:first-child)::before{
    content:''; position:absolute; left:-5.5px; top:-9px; bottom:-9px; width:1px;
    background:var(--line);
  }
  .item-row.head > *:not(:first-child)::before{ top:-10px; bottom:-6px; }
  .item-row.touched{ background:#faf6ea;}
  .item-name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item-price{ font-size:10.5px; color:var(--muted); font-weight:500; display:block; font-family:var(--mono);}
  .item-row input{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:7px 2px;
    text-align:center; font-size:13px; font-family:var(--mono); background:#fbf8f1;
  }
  .item-row .cell{ display:block; min-width:0; }
  .item-row input:focus{ outline:2px solid var(--accent); outline-offset:1px; background:#fff;}
  .sold-val{ text-align:center; font-weight:700; color:var(--ink); font-family:var(--mono);}
  .sales-val{ text-align:right; font-weight:800; color:var(--good); font-family:var(--mono);}
  .no-results{ padding:24px 14px; text-align:center; color:var(--muted); font-size:13px;}
  .item-del{
    display:inline-block; margin-left:6px; color:var(--muted); font-weight:700; cursor:pointer;
    font-family:var(--sans); font-size:13px; line-height:1; vertical-align:middle;
  }
  .item-del:hover{ color:var(--bad); }
  .add-item-row{
    width:100%; border:1px dashed var(--line); background:none; border-radius:9px;
    padding:10px; margin-top:8px; font-size:12.5px; font-weight:700; color:var(--muted);
    font-family:var(--sans); cursor:pointer;
  }
  .add-item-row:hover{ border-color:var(--accent); color:var(--accent); }

  .summary{
    background:var(--ink); color:#f4ede0; border-radius:16px; padding:18px; margin-top:20px;
    position:relative;
  }
  .summary h2{ margin:0 0 12px; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:#a89e8c; display:flex; justify-content:space-between; align-items:center;}
  .copy-btn{
    background:#2a241d; border:1px solid #3d362a; color:#e6dcc8; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:7px; cursor:pointer; font-family:var(--sans);
  }
  .copy-btn:active{ background:#3d362a;}
  .send-btn{ background:var(--accent); border-color:var(--accent); color:#fff2ec;}
  .send-btn:active{ background:#96341a;}
  .srow{ display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid #2b2519; font-size:14px;}
  .srow:first-of-type{ border-top:none;}
  .srow .swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:8px;}
  .srow .num{ font-size:13.5px;}
  .srow.total{ font-weight:800; font-size:16px; border-top:1px solid #3d362a; margin-top:4px; padding-top:12px;}
  .collect-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0;}
  .collect-row input{
    width:110px; text-align:right; background:#241f18; border:1px solid #3d362a; color:#f4ede0;
    border-radius:8px; padding:7px 9px; font-size:14px; font-family:var(--mono);
  }
  .missing{ font-weight:800;}
  .missing.bad{ color:#ff9376;}
  .missing.good{ color:#7be0af;}
  .reset-link{
    display:block; text-align:center; margin-top:14px; font-size:11.5px; color:#7d7461;
    background:none; border:none; cursor:pointer; width:100%; padding:6px; font-family:var(--sans);
  }

  .shift-section{ margin-top:22px;}
  .shift-section h2{ font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px;}
  .shift-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;
  }
  .shift-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .shift-grid label{ font-size:9.5px; text-transform:uppercase; color:var(--muted); font-weight:700; display:block; margin-bottom:3px; letter-spacing:.03em;}
  .shift-grid input{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:8px; font-size:13px;
    font-family:var(--sans); background:#fbf8f1;
  }
  .shift-grid input[type=time],.shift-grid input[type=number]{ font-family:var(--mono);}
  .shift-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:12px; color:var(--muted); font-family:var(--mono);}
  .del-btn{ background:none; border:none; color:var(--bad); font-size:12px; font-weight:700; cursor:pointer; padding:4px; font-family:var(--sans);}
  .add-btn{
    width:100%; padding:12px; border-radius:10px; border:1.5px dashed var(--line); background:none;
    color:var(--muted); font-weight:700; font-size:13px; cursor:pointer; margin-top:6px; font-family:var(--sans);
  }
  .add-btn:active{ border-color:var(--accent); color:var(--accent);}
  .payroll-total{
    display:flex; justify-content:space-between; padding:10px 2px 4px; font-size:13px; font-weight:700;
  }

  /* history view */
  .history-list{ display:flex; flex-direction:column; gap:8px;}
  .history-row{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .history-row:active{ background:#f4eddd;}
  .history-date{ font-weight:700; font-size:13.5px;}
  .history-sub{ font-size:11px; color:var(--muted); margin-top:2px;}
  .history-amt{ text-align:right;}
  .history-amt .rev{ font-family:var(--mono); font-weight:800; font-size:14px;}
  .history-amt .diff{ font-family:var(--mono); font-size:11px; font-weight:700; margin-top:2px;}
  .history-empty{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px;}

  .week-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:12px;}
  .week-label{ font-weight:700; font-size:14px; font-family:var(--mono); min-width:140px; text-align:center;}

  .status{ text-align:center; font-size:11px; color:var(--muted); margin-top:16px; font-family:var(--mono);}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#f4ede0; padding:10px 18px; border-radius:999px; font-size:12.5px;
    font-weight:700; opacity:0; transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .share-modal{
    position:fixed; inset:0; background:rgba(15,12,9,.55); display:none; align-items:center;
    justify-content:center; z-index:60; padding:20px;
  }
  .share-modal.show{ display:flex;}
  .share-card{ background:var(--panel); border-radius:14px; padding:16px; width:100%; max-width:420px;}
  .share-title{ font-weight:800; font-size:12px; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .share-card textarea{
    width:100%; height:170px; border:1px solid var(--line); border-radius:8px; padding:10px;
    font-family:var(--mono); font-size:12px; resize:none; background:#fbf8f1; margin-bottom:10px; line-height:1.5;
  }
  .store-name-input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px;
    font-family:var(--sans); background:#fbf8f1;
  }
  .store-name-input:focus{ outline:2px solid var(--accent); outline-offset:0;}
  .color-swatch{
    width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;
  }
  .color-swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--ink); }
  ::-webkit-scrollbar{ height:0; width:0;}
</style>
</head>
<body>

<header>
  <div class="row">
    <div class="brand">
      <div>
        <h1><span class="mark"></span>Ledger</h1>
        <div class="sub" id="dateLabel">loading…</div>
      </div>
    </div>
    <div class="head-controls">
      <div class="date-box"><input type="date" id="datePicker"></div>
    </div>
  </div>
  <div class="store-tabs-wrap" id="storeTabsWrap">
    <div class="store-tabs" id="storeTabs"></div>
    <button class="day-add" id="addStoreBtn">+ Store</button>
  </div>
  <div class="view-switch">
    <button id="btnSheet" class="active">Daily</button>
    <button id="btnWeek">Week</button>
    <button id="btnHistory">History</button>
  </div>
  <div class="day-tabs-wrap" id="dayTabsWrap">
    <button class="day-nav" id="dayPrev">‹</button>
    <div class="day-tabs" id="dayTabs"></div>
    <button class="day-nav" id="dayNext">›</button>
    <button class="day-add" id="dayAddNext">+ Next day</button>
  </div>
</header>

<main>
  <div id="sheetView">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search items…">
    </div>
    <button class="edit-prices-link" id="editPricesBtn">✎ Edit prices</button>
    <div class="tabs" id="tabs"></div>
    <div id="categories"></div>
    <div class="summary" id="summary"></div>

    <div class="shift-section">
      <h2>Employee / Shift Tracking</h2>
      <div id="shifts"></div>
      <button class="add-btn" id="addShift">+ Add shift</button>
      <div class="payroll-total" id="payrollTotal"></div>
    </div>

    <div class="status" id="status">Saved locally for this date</div>
    <div class="status" id="syncBadge" style="opacity:.7;"></div>
  </div>

  <div id="historyView" style="display:none;">
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="weekView" style="display:none;">
    <div class="week-nav">
      <button class="day-nav" id="weekPrev">‹</button>
      <div class="week-label" id="weekLabel">—</div>
      <button class="day-nav" id="weekNext">›</button>
    </div>
    <div class="summary" id="weekSummary"></div>
    <h2 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px;">Items sold this week</h2>
    <div id="weekCategories"></div>
    <h2 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px;">Day by day</h2>
    <div class="history-list" id="weekDayList"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="share-modal" id="shareModal">
  <div class="share-card">
    <div class="share-title">Select all &amp; copy</div>
    <textarea id="shareText" readonly></textarea>
    <button class="add-btn" id="shareModalClose">Done</button>
  </div>
</div>

<div class="share-modal" id="storeModal">
  <div class="share-card">
    <div class="share-title">New store</div>
    <input type="text" id="newStoreInput" placeholder="e.g. Store 91" class="store-name-input">
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="add-btn" id="storeModalCancel" style="flex:1;">Cancel</button>
      <button class="add-btn" id="storeModalAdd" style="flex:1; border-color:var(--accent); color:var(--accent); border-style:solid;">Add store</button>
    </div>
  </div>
</div>

<div class="share-modal" id="itemModal">
  <div class="share-card">
    <div class="share-title" id="itemModalTitle">New item</div>
    <input type="text" id="newItemName" placeholder="Item name" class="store-name-input" style="width:100%; margin-bottom:8px;">
    <input type="text" inputmode="decimal" id="newItemPrice" placeholder="Price (e.g. 15)" class="store-name-input" style="width:100%;">
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="add-btn" id="itemModalCancel" style="flex:1;">Cancel</button>

<script>
// ===================== CLOUD SYNC CONFIG =====================
// 1. Create a free project at https://supabase.com

const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const cloudEnabled = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
const sb = cloudEnabled ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let dayChannel = null;
let storesChannel = null;

function setSyncBadge(state){
  // state: 'online' | 'offline' | 'syncing' | 'off'
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.dataset.state = state;
  el.textContent = state === 'online' ? '● synced'
    : state === 'syncing' ? '● syncing…'
    : state === 'offline' ? '● offline (saved on device)'
    : '';
}

function isInputFocusedIn(containerId){
  const el = document.activeElement;
  const container = document.getElementById(containerId);
  return !!(el && container && container.contains(el) && (el.tagName==='INPUT' || el.tagName==='TEXTAREA'));
}

// Re-rendering a section with innerHTML='' destroys and recreates its inputs,
// which drops keyboard focus mid-typing (e.g. typing "10" only registers the "1").
// This wraps a render call so the previously-focused input regains focus + cursor
// position afterward, identified by its data-* attributes (or id) rather than a
// CSS selector, since item names can contain characters like ' and $ that would
// otherwise need escaping.
function withFocusPreserved(renderFn, containerId){
  const active = document.activeElement;
  const container = containerId ? document.getElementById(containerId) : null;
  let info = null;
  if (active && active.tagName === 'INPUT' && (!container || container.contains(active))){
    info = {
      id: active.id || null,
      item: active.dataset.item ?? null,
      field: active.dataset.field ?? null,
      idx: active.dataset.idx ?? null,
      selStart: active.selectionStart,
      selEnd: active.selectionEnd
    };
  }
  renderFn();
  if (info){
    let el = null;
    if (info.id){
      el = document.getElementById(info.id);
    }else{
      const scope = container || document;
      el = Array.from(scope.querySelectorAll('input')).find(inp =>
        (inp.dataset.item ?? null) === info.item &&
        (inp.dataset.field ?? null) === info.field &&
        (inp.dataset.idx ?? null) === info.idx
      );
    }
    if (el){
      el.focus();
      if (typeof info.selStart === 'number'){
        try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(err){ /* not a text-selectable input type */ }
      }
    }
  }
}

// ===================== END CLOUD SYNC CONFIG =====================

// Categories are now a mutable, syncable list (see addCategory / cloud sync
// functions further down) rather than a fixed set of four. Each has a "hex"
// (used everywhere in-app: tabs, section headers, Copy) and a "brightHex"
// (used only in the spreadsheet-style Send image, to match the vivid palette
// of the original spreadsheet this app replaced). For categories the user
// adds themselves there's no legacy spreadsheet color to match, so both
// fields are simply set to the one color they pick.
let CATS = [
  {key:'green', label:'Green', hex:'#3c8f7d', brightHex:'#2FE0D0'},
  {key:'tobacco', label:'Tobacco', hex:'#b23a2f', brightHex:'#FF3B30'},
  {key:'grabba', label:'Grabba', hex:'#c99a1f', brightHex:'#FFF200'},
  {key:'vapes', label:'Vapes', hex:'#a63d84', brightHex:'#FF00FF'},
];

// Picks readable black or white text for a given hex background, so a
// user-chosen category color (which could be light or dark) never ends up
// with illegible text on top of it.
function contrastText(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? '#171310' : '#ffffff';
}

function catByKey(key){ return CATS.find(c => c.key === key); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(err){ /* fall through to legacy method */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(err){ return false; }
}

async function copyRichText(plainText, html){
  try{
    const item = new ClipboardItem({
      'text/plain': new Blob([plainText], {type:'text/plain'}),
      'text/html': new Blob([html], {type:'text/html'}),
    });
    await navigator.clipboard.write([item]);
    return true;
  }catch(err){ /* rich clipboard not supported here — fall back to plain text */ }
  return copyText(plainText);
}

function showShareModal(text){

  modal.classList.add('show');

}

// Default product catalog (seed data). This becomes mutable once loaded, since
// items can be added/removed at runtime and synced to the cloud — see
// pullItemsFromCloud() / saveItemToCloud() further down.
let ITEMS = [
  {n:"10s", p:10, c:"green"}, {n:"15s", p:15, c:"green"}, {n:"20s", p:20, c:"green"},
  {n:"25s", p:25, c:"green"}, {n:"Munchie's", p:30, c:"green"}, {n:"7G's", p:40, c:"green"},
  {n:"7G's-$25", p:25, c:"green"}, {n:"topshelf", p:50, c:"green"}, {n:"60s", p:60, c:"green"},
  {n:"Tyson", p:40, c:"green"}, {n:"Flav", p:30, c:"green"}, {n:"Jar's", p:30, c:"green"},
  {n:"pre rolls 10$", p:10, c:"green"}, {n:"pre roll 15$", p:15, c:"green"},
  {n:"2GD", p:40, c:"green"}, {n:"1GD", p:25, c:"green"}, {n:"1GC", p:25, c:"green"},
  {n:"2GC", p:40, c:"green"}, {n:"Blink", p:40, c:"green"}, {n:"JB", p:25, c:"green"},
  {n:"wax 1 gram", p:10, c:"green"}, {n:"wax Oz", p:80, c:"green"},

  {n:"Cigarettes", p:13, c:"tobacco"}, {n:"Backwoods Packs", p:10, c:"tobacco"},
  {n:"Backwoods Loose", p:10, c:"tobacco"}, {n:"Zigzag", p:5, c:"tobacco"},
  {n:"Entourage", p:2, c:"tobacco"}, {n:"Bluntville", p:2, c:"tobacco"},

  {n:"YOLO", p:2, c:"grabba"}, {n:"Ted", p:2, c:"grabba"}, {n:"Hot Grabba $2", p:2, c:"grabba"},
  {n:"Hot grabba $4", p:4, c:"grabba"}, {n:"Alien", p:2, c:"grabba"}, {n:"Gorilla", p:2, c:"grabba"},
  {n:"$1", p:1, c:"grabba"}, {n:"Hot Head", p:2, c:"grabba"}, {n:"Bushead", p:2, c:"grabba"},

  {n:"Airbar Diamond", p:15, c:"vapes"}, {n:"Airbar Nex", p:15, c:"vapes"}, {n:"Juul", p:15, c:"vapes"},
  {n:"Razz", p:15, c:"vapes"}, {n:"25k Geek", p:25, c:"vapes"}, {n:"15k Geek", p:20, c:"vapes"},
  {n:"Flum", p:15, c:"vapes"}, {n:"BC (1 flavor)", p:15, c:"vapes"}, {n:"Airbar Aura", p:15, c:"vapes"},
  {n:"Lava", p:15, c:"vapes"}, {n:"Myle", p:15, c:"vapes"}, {n:"2.99 Loose Leaf", p:2.99, c:"vapes"},
  {n:"Loose Leaf 5 Pack", p:10, c:"vapes"},
];

const fmt = n => '$' + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// Amount fields use type="text" (not type="number") because number inputs can't have
// their cursor position restored after a re-render, which broke typing multi-digit
// values. This keeps only digits and a single decimal point.
function sanitizeAmount(str){
  let out = '';
  let seenDot = false;
  for (const ch of str){
    if (ch >= '0' && ch <= '9'){ out += ch; }
    else if (ch === '.' && !seenDot){ out += ch; seenDot = true; }
  }
  return out;
}
const todayStr = () => new Date().toISOString().slice(0,10);

let currentDate = todayStr();
let stores = [];        // [{id, name}]
let activeStore = null; // store id
let counts = {};
let cashCollected = 0;
let shiftsData = [];
let activeTab = 'green';
let searchTerm = '';
let saveTimer = null;
let currentView = 'sheet';
let weekAnchor = todayStr();
let savedDatesSet = new Set();

function slugify(name){
  let s = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if (!s) s = 'store';
  let id = s, n = 2;
  while (stores.some(st => st.id === id)){ id = s + '-' + n; n++; }
  return id;
}
function slugifyCategoryKey(name){
  let s = name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if (!s) s = 'category';
  let key = s, n = 2;
  while (CATS.some(c => c.key === key)){ key = s + '-' + n; n++; }
  return key;
}
function storeName(id){
  const st = stores.find(s => s.id === id);
  return st ? st.name : '';
}
function dayKey(dateStr){
  return 'day:' + activeStore + ':' + dateStr;
}

function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function emptyCounts(){
  const o = {};
  ITEMS.forEach(it => o[it.n] = {had:'', gave:'', left:''});
  return o;
}

function calcSold(it){
  const c = counts[it.n] || {had:'',gave:'',left:''};
  const had = parseFloat(c.had), gave = parseFloat(c.gave), left = parseFloat(c.left);
  if (isNaN(had) && isNaN(gave) && isNaN(left)) return null;
  return (isNaN(had)?0:had) + (isNaN(gave)?0:gave) - (isNaN(left)?0:left);
}
function isTouched(it){
  const c = counts[it.n] || {};
  return c.had !== '' || c.gave !== '' || c.left !== '';
}
function categoryTotal(catKey){
  let tot = 0;
  ITEMS.filter(i=>i.c===catKey).forEach(it=>{
    const sold = calcSold(it);
    if (sold) tot += sold * it.p;
  });
  return tot;
}
function totalInventoryValue(){
  let tot = 0;
  ITEMS.forEach(it=>{
    const had = parseFloat((counts[it.n]||{}).had);
    if (!isNaN(had)) tot += had * it.p;
  });
  return tot;
}
function totalItemsSold(){
  let tot = 0;
  ITEMS.forEach(it=>{
    const sold = calcSold(it);
    if (sold) tot += sold;
  });
  return tot;
}
function totalPayroll(){
  return shiftsData.reduce((sum,s)=> sum + (parseFloat(s.pay)||0), 0);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 1600);
}

function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  for (let i=-3; i<=3; i++){
    const d = addDays(currentDate, i);
    const dateObj = new Date(d + 'T00:00:00');
    const chip = document.createElement('button');
    chip.className = 'day-chip' + (d===currentDate ? ' active':'') + (savedDatesSet.has(d) ? ' has-data':'');
    chip.innerHTML = `<span class="dow">${dateObj.toLocaleDateString('en-US',{weekday:'short'})}</span>${dateObj.getDate()}`;
    chip.addEventListener('click', ()=> loadDay(d));
    wrap.appendChild(chip);
  }
  const active = wrap.querySelector('.active');
  if (active) active.scrollIntoView({inline:'center', block:'nearest'});
}

document.getElementById('dayPrev').addEventListener('click', ()=> loadDay(addDays(currentDate, -1)));
document.getElementById('dayNext').addEventListener('click', ()=> loadDay(addDays(currentDate, 1)));
document.getElementById('dayAddNext').addEventListener('click', ()=> loadDay(addDays(currentDate, 1)));

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CATS.forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab===cat.key ? ' active':'');
    const amt = categoryTotal(cat.key);
    b.innerHTML = `<span class="dot" style="background:${cat.hex}"></span>${cat.label}${amt? `<span class="tab-amt">${fmt(amt)}</span>`:''}`;
    b.onclick = () => { activeTab = cat.key; renderTabs(); renderCategories(); };
    tabs.appendChild(b);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'tab tab-add';
  addBtn.textContent = '+ Category';
  addBtn.id = 'addCategoryBtn';
  addBtn.addEventListener('click', openCategoryModal);
  tabs.appendChild(addBtn);
}

function renderCategories(){
  const wrap = document.getElementById('categories');
  wrap.innerHTML = '';
  const term = searchTerm.trim().toLowerCase();

  CATS.forEach(cat=>{
    if (cat.key !== activeTab) return;
    let items = ITEMS.filter(i=>i.c===cat.key);
    if (term) items = items.filter(i=> i.n.toLowerCase().includes(term));

    const section = document.createElement('div');
    section.className = 'cat-section';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.style.background = cat.hex;
    head.style.color = contrastText(cat.hex);
    head.innerHTML = `<span>${cat.label}</span><span class="tot num">${fmt(categoryTotal(cat.key))}</span>`;
    section.appendChild(head);

    if (items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'no-results';
      empty.textContent = `No items match "${searchTerm}"`;
      section.appendChild(empty);
    }else{
      const colHead = document.createElement('div');
      colHead.className = 'item-row head';
      colHead.innerHTML = `<div>Item</div><div style="text-align:center">Had</div><div style="text-align:center">Gave</div><div style="text-align:center">Left</div><div style="text-align:center">Sold</div><div style="text-align:right">Sales</div>`;
      section.appendChild(colHead);

      items.forEach(it=>{
        const row = document.createElement('div');
        row.className = 'item-row' + (isTouched(it) ? ' touched':'');
        const c = counts[it.n] || {had:'',gave:'',left:''};
        const sold = calcSold(it);

        row.innerHTML = `
          <div class="item-name">${it.n}<span class="item-price">${fmt(it.p)}</span><span class="item-del" data-remove-item="${it.n}" title="Remove item">×</span></div>
          <div class="cell"><input type="text" inputmode="decimal" autocomplete="off" data-item="${it.n}" data-field="had" value="${c.had}"></div>
          <div class="cell"><input type="text" inputmode="decimal" autocomplete="off" data-item="${it.n}" data-field="gave" value="${c.gave}"></div>
          <div class="cell"><input type="text" inputmode="decimal" autocomplete="off" data-item="${it.n}" data-field="left" value="${c.left}"></div>
          <div class="sold-val num">${sold===null? '—' : sold}</div>
          <div class="sales-val num">${sold? fmt(sold*it.p) : '—'}</div>
        `;
        section.appendChild(row);
      });
    }

    const addRow = document.createElement('button');
    addRow.className = 'add-item-row';
    addRow.dataset.addCategory = cat.key;
    addRow.textContent = `+ Add ${cat.label.toLowerCase()} item`;
    section.appendChild(addRow);

    wrap.appendChild(section);
  });

  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const clean = sanitizeAmount(e.target.value);
      if (clean !== e.target.value) e.target.value = clean;
      const item = e.target.dataset.item, field = e.target.dataset.field;
      if (!counts[item]) counts[item] = {had:'',gave:'',left:''};
      counts[item][field] = clean;
      withFocusPreserved(()=>{ renderCategories(); renderTabs(); renderSummary(); }, 'categories');
      scheduleSave();
    });
  });

  wrap.querySelectorAll('[data-remove-item]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      e.stopPropagation();
      const name = e.target.dataset.removeItem;
      if (!confirm(`Remove "${name}" from the product list? Past sales history for it is kept, it just won't show on new sheets.`)) return;
      await removeItem(name);
      showToast(`Removed ${name}`);
    });
  });

  wrap.querySelectorAll('[data-add-category]').forEach(btn=>{
    btn.addEventListener('click', ()=> openItemModal(btn.dataset.addCategory));
  });
}

function renderSummary(){
  const el = document.getElementById('summary');
  const catTotals = {};
  CATS.forEach(cat => { catTotals[cat.key] = categoryTotal(cat.key); });
  const expected = Object.values(catTotals).reduce((a,b) => a+b, 0);
  const missing = cashCollected - expected;
  const missingClass = missing < 0 ? 'bad' : 'good';
  const missingLabel = missing < 0 ? 'Missing' : (missing > 0 ? 'Over' : 'Even');

  const catRows = CATS.map(cat => `
    <div class="srow"><span><span class="swatch" style="background:${cat.hex}"></span>${esc(cat.label)} total sales</span><span class="num">${fmt(catTotals[cat.key])}</span></div>
  `).join('');

  el.innerHTML = `
    <h2>Totals · Cash &amp; Card Check
      <span style="display:flex; gap:6px;">
        <button class="copy-btn" id="copyBtn">Copy</button>
        <button class="copy-btn send-btn" id="sendBtn">Send ↗</button>
      </span>
    </h2>
    ${catRows}
    <div class="srow"><span>Total inventory value (on hand)</span><span class="num">${fmt(totalInventoryValue())}</span></div>
    <div class="srow"><span>Total items sold</span><span class="num">${totalItemsSold()}</span></div>
    <div class="srow total"><span>Expected revenue</span><span class="num">${fmt(expected)}</span></div>
    <div class="collect-row">
      <span>Cash / card collected</span>
      <input type="text" inputmode="decimal" autocomplete="off" id="cashInput" value="${cashCollected || ''}" placeholder="0.00">
    </div>
    <div class="srow"><span>${missingLabel} / over</span><span class="num missing ${missingClass}">${fmt(Math.abs(missing))}</span></div>
    <button class="reset-link" id="resetBtn">Clear all counts for this date</button>
  `;

  document.getElementById('cashInput').addEventListener('input', e=>{
    const clean = sanitizeAmount(e.target.value);
    if (clean !== e.target.value) e.target.value = clean;
    cashCollected = parseFloat(clean) || 0;
    withFocusPreserved(renderSummary, 'summary');
    scheduleSave();
  });

  const GOOD_HEX = '#2f8f5b';
  const BAD_HEX = '#b3401f';

  function buildSummaryText(){
    const lines = [
      `${currentDate}${activeStore? ' — '+storeName(activeStore) : ''}`,
    ];

    // Fixed-width columns (relies on a monospace font to actually line up —
    // true column alignment isn't possible in plain text with a variable-width
    // font, but this renders correctly in Notes, code blocks, Slack, etc.).
    const pad = (s, w) => String(s).padEnd(w, ' ');
    const padR = (s, w) => String(s).padStart(w, ' ');

    CATS.forEach(cat=>{
      const catItems = ITEMS.filter(it => it.c === cat.key && isTouched(it));
      if (catItems.length === 0) return;
      const tableWidth = 16+1+4+1+4+1+4+1+4+1+9;
      lines.push('');
      lines.push(cat.label.toUpperCase());
      lines.push(`${pad('Item',16)} ${padR('Had',4)} ${padR('Gave',4)} ${padR('Left',4)} ${padR('Sold',4)} ${padR('Sales',9)}`);
      lines.push('-'.repeat(tableWidth));
      catItems.forEach((it, idx)=>{
        const c = counts[it.n] || {had:'',gave:'',left:''};
        const sold = calcSold(it);
        const soldStr = sold === null ? '—' : String(sold);
        const salesStr = sold ? fmt(sold * it.p) : fmt(0);
        const name = it.n.length > 16 ? it.n.slice(0,15)+'…' : it.n;
        lines.push(`${pad(name,16)} ${padR(c.had||0,4)} ${padR(c.gave||0,4)} ${padR(c.left||0,4)} ${padR(soldStr,4)} ${padR(salesStr,9)}`);
        // Row divider between every item, not just once under the header — so
        // Had/Gave/Left/Sold/Sales stay visually separated line by line.
        if (idx < catItems.length - 1) lines.push('-'.repeat(tableWidth));
      });
      lines.push('-'.repeat(tableWidth));
    });

    lines.push('');
    lines.push('TOTALS');
    const totalsLabelW = 18;
    const totalsValW = 10;
    const totalRow = (label, value) => lines.push(`${pad(label, totalsLabelW)} ${padR(value, totalsValW)}`);
    lines.push('-'.repeat(totalsLabelW + 1 + totalsValW));
    CATS.forEach(cat => totalRow(cat.label, fmt(catTotals[cat.key])));
    totalRow('Expected', fmt(expected));
    totalRow('Collected', fmt(cashCollected));
    totalRow(missingLabel, fmt(Math.abs(missing)));

    if (shiftsData.length){
      lines.push('');
      lines.push('Payroll: ' + fmt(totalPayroll()));
    }
    return lines.join('\n');
  }

  // Real HTML <table> version — pastes as an actual grid (real column/row
  // borders) into apps that support rich text: Gmail, Google Docs, Notes,
  // Sheets/Excel, Slack. Plain-text destinations (SMS, most share-sheet
  // targets) can't render a table at all regardless of what's produced here —
  // see buildSummaryText above for that fallback.

  function buildSummaryHTML(){
    const cellStyle = 'border:1px solid #ccc; padding:4px 8px; font-family:sans-serif; font-size:13px;';
    const parts = [`<div style="font-family:sans-serif; font-size:14px; color:#171310;">`];
    parts.push(`<div style="font-weight:700; margin-bottom:10px;">${esc(currentDate)}${activeStore? ' — '+esc(storeName(activeStore)) : ''}</div>`);

    CATS.forEach(cat=>{
      const catItems = ITEMS.filter(it => it.c === cat.key && isTouched(it));
      if (catItems.length === 0) return;
      const hex = cat.hex;
      parts.push(`<div style="font-weight:800; color:${hex}; margin:14px 0 4px; text-transform:uppercase; font-size:12px; letter-spacing:.04em;">${esc(cat.label)}</div>`);
      parts.push(`<table style="border-collapse:collapse; width:100%; margin-bottom:4px;">`);
      parts.push(`<tr style="background:${hex}; color:${contrastText(hex)};">
        <th style="${cellStyle} text-align:left;">Item</th>
        <th style="${cellStyle} text-align:center;">Had</th>
        <th style="${cellStyle} text-align:center;">Gave</th>
        <th style="${cellStyle} text-align:center;">Left</th>
        <th style="${cellStyle} text-align:center;">Sold</th>
        <th style="${cellStyle} text-align:right;">Sales</th>
      </tr>`);
      catItems.forEach(it=>{
        const c = counts[it.n] || {had:'',gave:'',left:''};
        const sold = calcSold(it);
        const soldStr = sold === null ? '—' : String(sold);
        const salesStr = sold ? fmt(sold * it.p) : fmt(0);
        parts.push(`<tr>
          <td style="${cellStyle} font-weight:600;">${esc(it.n)}</td>
          <td style="${cellStyle} text-align:center;">${esc(c.had||0)}</td>
          <td style="${cellStyle} text-align:center;">${esc(c.gave||0)}</td>
          <td style="${cellStyle} text-align:center;">${esc(c.left||0)}</td>
          <td style="${cellStyle} text-align:center;">${soldStr}</td>
          <td style="${cellStyle} text-align:right; font-weight:700;">${salesStr}</td>
        </tr>`);
      });
      parts.push(`</table>`);
    });

    parts.push(`<table style="border-collapse:collapse; width:100%; margin-top:10px;">`);
    CATS.forEach(cat=>{
      parts.push(`<tr><td style="${cellStyle} font-weight:700; color:${cat.hex};">${esc(cat.label)}</td><td style="${cellStyle} text-align:right;">${fmt(catTotals[cat.key])}</td></tr>`);
    });
    parts.push(`<tr><td style="${cellStyle} font-weight:700;">Expected</td><td style="${cellStyle} text-align:right; font-weight:700;">${fmt(expected)}</td></tr>`);
    parts.push(`<tr><td style="${cellStyle}">Collected</td><td style="${cellStyle} text-align:right;">${fmt(cashCollected)}</td></tr>`);
    const missColor = missing < 0 ? BAD_HEX : GOOD_HEX;
    parts.push(`<tr><td style="${cellStyle} font-weight:700; color:${missColor};">${esc(missingLabel)}</td><td style="${cellStyle} text-align:right; font-weight:700; color:${missColor};">${fmt(Math.abs(missing))}</td></tr>`);
    parts.push(`</table>`);

    if (shiftsData.length){
      parts.push(`<div style="margin-top:10px; font-weight:700;">Payroll: ${fmt(totalPayroll())}</div>`);
    }
    parts.push(`</div>`);
    return parts.join('');
  }

  // Renders the same colored summary as an actual PNG image (via <canvas>) so
  // it can be shared as a file. Sharing an image through the native share sheet
  // is what gives the "Save Image" / "Save to Photos" option on iOS and Android —
  // sharing plain text never does, regardless of the app.
  function buildSummaryRows(){
    const rows = [{ type:'title', text: `${currentDate}${activeStore? ' — '+storeName(activeStore) : ''}` }];

    CATS.forEach(cat=>{
      const catItems = ITEMS.filter(it => it.c === cat.key && isTouched(it));
      if (catItems.length === 0) return;
      rows.push({ type:'catHeader', text: cat.label.toUpperCase(), color: cat.hex });
      catItems.forEach(it=>{
        const c = counts[it.n] || {had:'',gave:'',left:''};
        const sold = calcSold(it);
        const soldStr = sold === null ? '—' : sold;
        const salesStr = sold ? fmt(sold * it.p) : fmt(0);
        rows.push({
          type:'item', color: cat.hex, name: it.n,
          detail: `had ${c.had||0}, gave ${c.gave||0}, left ${c.left||0}, sold ${soldStr}`,
          amount: salesStr,
        });
      });
    });

    rows.push({ type:'divider' });
    CATS.forEach(cat=>{
      rows.push({ type:'total', label:cat.label, value: fmt(catTotals[cat.key]), color: cat.hex });
    });
    rows.push({ type:'totalBold', label:'Expected', value: fmt(expected) });
    rows.push({ type:'total', label:'Collected', value: fmt(cashCollected) });
    rows.push({ type:'totalBold', label: missingLabel, value: fmt(Math.abs(missing)), color: missing < 0 ? BAD_HEX : GOOD_HEX });

    if (shiftsData.length){
      rows.push({ type:'divider' });
      rows.push({ type:'totalBold', label:'Payroll', value: fmt(totalPayroll()) });
    }
    return rows;
  }

  function rowHeight(r){
    switch(r.type){
      case 'title': return 46;
      case 'catHeader': return 32;
      case 'item': return 34;
      case 'divider': return 20;
      case 'total': return 26;
      case 'totalBold': return 30;
      default: return 24;
    }
  }

  function buildSummaryCanvas(){
    const rows = buildSummaryRows();
    const width = 640;
    const topPad = 28, bottomPad = 28, padX = 28;
    const height = topPad + rows.reduce((sum, r) => sum + rowHeight(r), 0) + bottomPad;

    const scale = 2; // draw at 2x for a crisp saved image
    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#f3ede2';
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = 'top';

    let cy = topPad;
    rows.forEach(r=>{
      const h = rowHeight(r);
      if (r.type === 'title'){
        ctx.fillStyle = '#171310';
        ctx.font = '700 18px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(r.text, padX, cy + 4);
      }else if (r.type === 'catHeader'){
        ctx.fillStyle = r.color;
        ctx.font = '800 13px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(r.text, padX, cy + 8);
      }else if (r.type === 'item'){
        ctx.fillStyle = r.color;
        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(r.name, padX, cy);
        ctx.fillStyle = '#171310';
        ctx.font = '400 11.5px "JetBrains Mono", monospace';
        ctx.fillText(r.detail, padX, cy + 16);
        ctx.fillStyle = '#171310';
        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(r.amount, width - padX, cy);
      }else if (r.type === 'divider'){
        ctx.strokeStyle = '#e4dbc8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padX, cy + 9);
        ctx.lineTo(width - padX, cy + 9);
        ctx.stroke();
      }else if (r.type === 'total' || r.type === 'totalBold'){
        ctx.fillStyle = r.color || '#171310';
        ctx.font = (r.type === 'totalBold' ? '700 14px' : '600 13px') + ' -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(r.label, padX, cy);
        ctx.textAlign = 'right';
        ctx.fillText(r.value, width - padX, cy);
      }
      cy += h;
    });

    return canvas;
  }

  // Builds the whole sheet as one continuous spreadsheet-style table — every
  // product as its own row with a solid category-colored background (not just
  // the touched ones), followed by a totals block and a shift-tracking block —
  // matching the original spreadsheet layout this app replaced. Uses each
  // category's brightHex (vivid, matching the original spreadsheet's palette
  // for the four built-in categories; equal to hex for any category the user
  // adds themselves, since there's no legacy color to match there).
  function buildSpreadsheetCapture(){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#111; background:#fff; width:900px;';

    const topBar = document.createElement('div');
    topBar.style.cssText = 'background:#1B2432; height:16px;';
    wrap.appendChild(topBar);

    const dateRow = document.createElement('table');
    dateRow.style.cssText = 'border-collapse:collapse; width:100%; margin:6px 0;';
    dateRow.innerHTML = `<tr>
      <td style="padding:4px 10px; font-weight:700; width:120px;">Date</td>
      <td style="padding:4px 10px;">${currentDate}${activeStore ? ' (' + storeName(activeStore) + ')' : ''}</td>
    </tr>`;
    wrap.appendChild(dateRow);

    const table = document.createElement('table');
    table.style.cssText = 'border-collapse:collapse; width:100%; table-layout:fixed;';
    const cols   = ['ITEM','Unit Price','Had','Gave','Left','Sold','Sales','Category'];
    const widths = ['24%','12%','8%','8%','8%','8%','12%','20%'];
    const aligns = ['left','right','center','center','center','center','right','left'];

    let html = '<colgroup>' + widths.map(w => `<col style="width:${w}">`).join('') + '</colgroup>';
    html += '<tr>' + cols.map((c,i) =>
      `<th style="background:#2554E0; color:#fff; font-weight:700; padding:6px 8px; border:1px solid #999; text-align:${aligns[i]};">${c}</th>`
    ).join('') + '</tr>';

    ITEMS.forEach(it=>{
      const itCat = catByKey(it.c);
      const bg = itCat ? itCat.brightHex : '#eee';
      const c = counts[it.n] || {had:'',gave:'',left:''};
      const sold = calcSold(it);
      const soldStr = sold === null ? '' : String(sold);
      const salesStr = sold === null ? '' : fmt(sold * it.p);
      const catLabel = itCat ? itCat.label : it.c;
      html += `<tr>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999;">${esc(it.n)}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:right;">${fmt(it.p)}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${esc(c.had||'')}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${esc(c.gave||'')}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${esc(c.left||'')}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${soldStr}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:right;">${salesStr}</td>
        <td style="background:${bg}; padding:5px 8px; border:1px solid #999;">${esc(catLabel)}</td>
      </tr>`;
    });
    table.innerHTML = html;
    wrap.appendChild(table);

    const spacer1 = document.createElement('div'); spacer1.style.height = '16px'; wrap.appendChild(spacer1);

    const totalsHeader = document.createElement('div');
    totalsHeader.style.cssText = 'background:#1B2432; color:#fff; font-weight:700; text-align:center; padding:6px; border:1px solid #999;';
    totalsHeader.textContent = 'TOTALS / CASH & CARD CHECK';
    wrap.appendChild(totalsHeader);

    const isNeg = missing < 0;
    const totalRows = [
      ...CATS.map(cat => ({ label: cat.label.toUpperCase() + ' TOTAL SALES', value: fmt(catTotals[cat.key]), bg: cat.brightHex })),
      { label:'TOTAL INVENTORY VALUE', value: fmt(totalInventoryValue()), bg:'#e6e6e6' },
      { label:'TOTAL ITEMS SOLD',      value: String(totalItemsSold()),   bg:'#e6e6e6' },
      { label:'EXPECTED REVENUE',      value: fmt(expected),              bg:'#e6e6e6' },
      { label:'CASH/CARD COLLECTED',   value: fmt(cashCollected),         bg:'#e6e6e6' },
      { label:'MISSING / OVER',        value: (isNeg?'-':'') + fmt(Math.abs(missing)), bg: isNeg ? '#f8b4b4' : '#c8f0c8' },
    ];
    const totalsTable = document.createElement('table');
    totalsTable.style.cssText = 'border-collapse:collapse; width:100%;';
    totalsTable.innerHTML = totalRows.map(r => `<tr>
      <td style="background:${r.bg}; font-weight:700; padding:5px 8px; border:1px solid #999; width:60%;">${r.label}</td>
      <td style="padding:5px 8px; border:1px solid #999; text-align:right; color:${r.label==='MISSING / OVER' && isNeg ? '#b3401f' : '#111'};">${r.value}</td>
    </tr>`).join('');
    wrap.appendChild(totalsTable);

    if (shiftsData.length){
      const spacer2 = document.createElement('div'); spacer2.style.height = '16px'; wrap.appendChild(spacer2);

      const shiftHeader = document.createElement('div');
      shiftHeader.style.cssText = 'background:#4A5568; color:#fff; font-weight:700; text-align:center; padding:6px; border:1px solid #999;';
      shiftHeader.textContent = 'EMPLOYEE / SHIFT TRACKING';
      wrap.appendChild(shiftHeader);

      const shiftCols = ['Store','Employee','Date','Start','End','Hours','Pay','Notes'];
      let shtml = '<tr>' + shiftCols.map(c => `<th style="background:#697489; color:#fff; padding:5px 8px; border:1px solid #999;">${c}</th>`).join('') + '</tr>';
      shiftsData.forEach(s=>{
        const hrs = hoursBetween(s.start, s.end);
        shtml += `<tr>
          <td style="padding:5px 8px; border:1px solid #999;">${esc(activeStore ? storeName(activeStore) : '')}</td>
          <td style="padding:5px 8px; border:1px solid #999;">${esc(s.employee||'')}</td>
          <td style="padding:5px 8px; border:1px solid #999;">${currentDate}</td>
          <td style="padding:5px 8px; border:1px solid #999;">${esc(s.start||'')}</td>
          <td style="padding:5px 8px; border:1px solid #999;">${esc(s.end||'')}</td>
          <td style="padding:5px 8px; border:1px solid #999; text-align:center;">${hrs===null? '' : hrs}</td>
          <td style="padding:5px 8px; border:1px solid #999; text-align:right;">${s.pay ? fmt(parseFloat(s.pay)) : ''}</td>
          <td style="padding:5px 8px; border:1px solid #999;">${esc(s.notes||'')}</td>
        </tr>`;
      });
      const shiftTable = document.createElement('table');
      shiftTable.style.cssText = 'border-collapse:collapse; width:100%;';
      shiftTable.innerHTML = shtml;
      wrap.appendChild(shiftTable);
    }

    return wrap;
  }

  // Renders the full spreadsheet-style sheet off-screen, then rasterizes it
  // with html2canvas — so the shared image looks like the original spreadsheet
  // this app replaced, not the app's own mobile card layout.
  async function captureFullSheetImage(){
    if (typeof html2canvas === 'undefined') return null; // library failed to load (e.g. offline first run)

    const root = buildSpreadsheetCapture();
    root.style.position = 'fixed';
    root.style.left = '-9999px';
    root.style.top = '0';
    document.body.appendChild(root);
    try{
      await new Promise(r => setTimeout(r, 30)); // let layout/fonts settle before capture
      const canvas = await html2canvas(root, { backgroundColor: '#f3ede2', scale: 2 });
      return canvas;
    }catch(err){
      console.error('full-sheet capture failed', err);
      return null;
    }finally{
      root.remove();
    }
  }

  document.getElementById('copyBtn').addEventListener('click', ()=>{
    copyRichText(buildSummaryText(), buildSummaryHTML())
      .then(ok => showToast(ok ? 'Summary copied (with colors — paste into Gmail, Notes, Docs, etc.)' : 'Could not copy — see box below'));
  });

  document.getElementById('sendBtn').addEventListener('click', async ()=>{
    const title = `Daily Summary — ${currentDate}`;
    const filename = `shift-sheet-${currentDate}.png`;

    let blob = null;
    try{
      const canvas = (await captureFullSheetImage()) || buildSummaryCanvas();
      blob = await canvasToBlob(canvas);
    }catch(err){ console.error('image generation failed', err); }

    if (blob){
      const file = new File([blob], filename, { type: 'image/png' });

      // Sharing a file (not just text) is what makes "Save Image" / "Save to
      // Photos" show up in the share sheet, and it's also what carries color.
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ title, files: [file] });
          return;
        }catch(err){
          if (err && err.name === 'AbortError') return; // user cancelled, not an error
          // fall through to download/text fallback below
        }
      }

      // No file-sharing support here (e.g. desktop browser) — just download the image directly.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      showToast('Image downloaded');
      return;
    }

    // Last-resort fallback if canvas image generation itself failed: old plain-text share.
    const text = buildSummaryText();
    if (navigator.share){
      try{
        await navigator.share({ title, text });
        return;
      }catch(err){
        if (err && err.name === 'AbortError') return;
      }
    }
    const copied = await copyText(text);
    if (copied){
      showToast('Sharing isn\'t available here — copied instead');
    } else {
      showShareModal(text);
    }
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if (confirm('Clear all Had/Gave/Left counts and cash collected for ' + currentDate + '?')){
      counts = emptyCounts();
      cashCollected = 0;
      renderTabs(); renderCategories(); renderSummary();
      scheduleSave();
      showToast('Cleared');
    }
  });
}

function hoursBetween(start, end){
  if (!start || !end) return null;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if (mins < 0) mins += 24*60;
  return Math.round((mins/60)*100)/100;
}

function renderShifts(){
  const wrap = document.getElementById('shifts');
  wrap.innerHTML = '';
  shiftsData.forEach((s, idx)=>{
    const hrs = hoursBetween(s.start, s.end);
    const card = document.createElement('div');
    card.className = 'shift-card';
    card.innerHTML = `
      <div class="shift-grid">
        <div style="grid-column:1/-1;"><label>Employee</label><input data-idx="${idx}" data-field="employee" value="${s.employee||''}" placeholder="Name"></div>
        <div><label>Start</label><input type="time" data-idx="${idx}" data-field="start" value="${s.start||''}"></div>
        <div><label>End</label><input type="time" data-idx="${idx}" data-field="end" value="${s.end||''}"></div>
        <div><label>Pay ($)</label><input type="text" inputmode="decimal" autocomplete="off" data-idx="${idx}" data-field="pay" value="${s.pay||''}"></div>
        <div><label>Notes</label><input data-idx="${idx}" data-field="notes" value="${s.notes||''}"></div>
      </div>
      <div class="shift-foot">
        <span>${hrs===null? 'set start/end' : hrs + ' hrs'}</span>
        <button class="del-btn" data-del="${idx}">Remove</button>
      </div>
    `;
    wrap.appendChild(card);
  });

  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = e.target.dataset.idx, field = e.target.dataset.field;
      let val = e.target.value;
      if (field === 'pay'){
        val = sanitizeAmount(val);
        if (val !== e.target.value) e.target.value = val;
      }
      shiftsData[idx][field] = val;
      withFocusPreserved(renderShifts, 'shifts');
      scheduleSave();
    });
  });
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      shiftsData.splice(parseInt(e.target.dataset.del), 1);
      renderShifts();
      scheduleSave();
    });
  });

  document.getElementById('payrollTotal').innerHTML =
    shiftsData.length ? `<span>Total payroll today</span><span class="num">${fmt(totalPayroll())}</span>` : '';
}

document.getElementById('addShift').addEventListener('click', ()=>{
  shiftsData.push({employee:'', start:'', end:'', pay:'', notes:''});
  renderShifts();
  scheduleSave();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  renderCategories();
});

function scheduleSave(){
  const status = document.getElementById('status');
  status.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDay, 400);
}

async function saveDay(){
  const status = document.getElementById('status');
  const payload = {counts, cashCollected, shifts: shiftsData};
  // Always write local cache first so nothing is lost if the network drops mid-save.
  try{
    localStorage.setItem(dayKey(currentDate), JSON.stringify(payload));
    if (!savedDatesSet.has(currentDate)){ savedDatesSet.add(currentDate); renderDayTabs(); }
  }catch(err){
    console.error(err);
  }

  if (!cloudEnabled){
    status.textContent = 'Saved for ' + currentDate + ' (on this device only)';
    return;
  }

  setSyncBadge('syncing');
  try{
    const { error } = await sb.from('ledger_days').upsert({
      store_id: activeStore,
      date: currentDate,
      data: payload,
      updated_at: new Date().toISOString()
    }, { onConflict: 'store_id,date' });
    if (error) throw error;
    status.textContent = 'Saved for ' + currentDate;
    setSyncBadge('online');
  }catch(err){
    console.error('cloud save failed', err);
    status.textContent = 'Saved on this device — will sync when back online';
    setSyncBadge('offline');
  }
}

async function loadDay(dateStr){
  currentDate = dateStr;
  document.getElementById('datePicker').value = dateStr;
  document.getElementById('dateLabel').textContent =
    new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const status = document.getElementById('status');
  status.textContent = 'Loading…';

  counts = emptyCounts();
  cashCollected = 0;
  shiftsData = [];
  searchTerm = '';
  document.getElementById('searchInput').value = '';

  let parsed = null;

  if (cloudEnabled){
    setSyncBadge('syncing');
    try{
      const { data, error } = await sb.from('ledger_days')
        .select('data')
        .eq('store_id', activeStore)
        .eq('date', dateStr)
        .maybeSingle();
      if (error) throw error;
      if (data){
        parsed = data.data;
        // keep local cache fresh for offline use
        localStorage.setItem(dayKey(dateStr), JSON.stringify(parsed));
      }
      setSyncBadge('online');
    }catch(err){
      console.error('cloud load failed, falling back to local cache', err);
      setSyncBadge('offline');
    }
  }

  if (!parsed){
    try{
      const raw = localStorage.getItem(dayKey(dateStr));
      if (raw) parsed = JSON.parse(raw);
    }catch(err){ /* nothing cached locally either */ }
  }

  if (parsed){
    counts = {...emptyCounts(), ...(parsed.counts||{})};
    cashCollected = parsed.cashCollected || 0;
    shiftsData = parsed.shifts || [];
    status.textContent = 'Saved for ' + dateStr;
  }else{
    status.textContent = 'No saved data for this date yet';
  }

  renderTabs();
  renderCategories();
  renderSummary();
  renderShifts();
  renderDayTabs();
  subscribeToDayChanges();
}

// Live updates: if a teammate saves this same store/date from another device,
// pull the fresh data in — unless the user is actively typing right now.
function subscribeToDayChanges(){
  if (!cloudEnabled) return;
  if (dayChannel) sb.removeChannel(dayChannel);
  dayChannel = sb.channel('ledger_days_' + activeStore)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'ledger_days',
      filter: 'store_id=eq.' + activeStore
    }, (payload) => {
      const row = payload.new;
      if (!row || row.date !== currentDate) return;
      if (isInputFocusedIn('sheetView')) { showToast('Teammate updated this day — save to refresh'); return; }
      loadDay(currentDate);
      showToast('Updated by a teammate');
    })
    .subscribe();
}

async function fetchAllDaysForStore(){
  // Returns a map of date -> dayData for the active store, preferring cloud data but
  // falling back to (and merging in) whatever's cached locally so nothing is lost offline.
  const map = {};
  const prefix = 'day:' + activeStore + ':';
  Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k=>{
    try{ map[k.replace(prefix,'')] = JSON.parse(localStorage.getItem(k)); }catch(err){ /* skip corrupt entry */ }
  });
  if (cloudEnabled){
    try{
      const { data, error } = await sb.from('ledger_days').select('date,data').eq('store_id', activeStore);
      if (error) throw error;
      (data||[]).forEach(row => { map[row.date] = row.data; });
    }catch(err){ console.error('cloud history fetch failed, using local cache only', err); }
  }
  return map;
}

async function renderHistory(){
  const list = document.getElementById('historyList');
  list.innerHTML = '<div class="history-empty">Loading…</div>';
  try{
    const dayMap = await fetchAllDaysForStore();
    const dates = Object.keys(dayMap).sort().reverse();
    if (dates.length === 0){
      list.innerHTML = '<div class="history-empty">No saved days yet for this store. Start entering counts on today\'s Daily tab.</div>';
      return;
    }
    const rows = [];
    for (const d of dates){
      const parsed = dayMap[d];
      if (!parsed) continue;
      const c = {...emptyCounts(), ...(parsed.counts||{})};
      let expected = 0;
      ITEMS.forEach(it=>{
        const cc = c[it.n];
        const had = parseFloat(cc.had), gave = parseFloat(cc.gave), left = parseFloat(cc.left);
        if (isNaN(had) && isNaN(gave) && isNaN(left)) return;
        const sold = (isNaN(had)?0:had) + (isNaN(gave)?0:gave) - (isNaN(left)?0:left);
        if (sold) expected += sold * it.p;
      });
      const collected = parsed.cashCollected || 0;
      const diff = collected - expected;
      rows.push({d, expected, collected, diff, hasCollected: !!parsed.cashCollected});
    }

    list.innerHTML = '';
    rows.forEach(r=>{
      const row = document.createElement('div');
      row.className = 'history-row';
      const diffClass = r.diff < 0 ? 'bad' : (r.diff > 0 ? 'good' : '');
      const diffLabel = !r.hasCollected ? '' : (r.diff < 0 ? 'Missing ' + fmt(Math.abs(r.diff)) : r.diff > 0 ? 'Over ' + fmt(r.diff) : 'Even');
      row.innerHTML = `
        <div>
          <div class="history-date">${new Date(r.d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'})}</div>
          <div class="history-sub">${r.d}</div>
        </div>
        <div class="history-amt">
          <div class="rev">${fmt(r.expected)}</div>
          <div class="diff missing ${diffClass}">${diffLabel}</div>
        </div>
      `;
      row.addEventListener('click', ()=>{
        switchView('sheet');
        loadDay(r.d);
      });
      list.appendChild(row);
    });
  }catch(err){
    list.innerHTML = '<div class="history-empty">Could not load history.</div>';
    console.error(err);
  }
}

function getMonday(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

async function fetchDayData(dateStr){
  if (cloudEnabled){
    try{
      const { data, error } = await sb.from('ledger_days')
        .select('data').eq('store_id', activeStore).eq('date', dateStr).maybeSingle();
      if (error) throw error;
      if (data) return data.data;
    }catch(err){ console.error('cloud fetch failed for', dateStr, err); }
  }
  try{
    const raw = localStorage.getItem(dayKey(dateStr));
    if (raw) return JSON.parse(raw);
  }catch(err){ /* nothing saved for this day */ }
  return null;
}

function computeDayTotals(dayData){
  const totals = {};
  CATS.forEach(cat => { totals[cat.key] = 0; });
  if (!dayData) return {...totals, expected:0};
  const c = {...emptyCounts(), ...(dayData.counts||{})};
  ITEMS.forEach(it=>{
    const cc = c[it.n];
    if (!cc) return;
    const had = parseFloat(cc.had), gave = parseFloat(cc.gave), left = parseFloat(cc.left);
    if (isNaN(had) && isNaN(gave) && isNaN(left)) return;
    const sold = (isNaN(had)?0:had) + (isNaN(gave)?0:gave) - (isNaN(left)?0:left);
    if (sold && it.c in totals) totals[it.c] += sold * it.p;
  });
  const expected = Object.values(totals).reduce((a,b) => a+b, 0);
  return {...totals, expected};
}

// Per-item had/gave/left/sold for a single day's saved data (touched items
// only) — used to build the week's item-level breakdown by summing this
// across all 7 days.
function computeDayItemDetail(dayData){
  const map = {};
  if (!dayData) return map;
  const c = {...emptyCounts(), ...(dayData.counts||{})};
  ITEMS.forEach(it=>{
    const cc = c[it.n];
    if (!cc) return;
    const had = parseFloat(cc.had), gave = parseFloat(cc.gave), left = parseFloat(cc.left);
    if (isNaN(had) && isNaN(gave) && isNaN(left)) return;
    const sold = (isNaN(had)?0:had) + (isNaN(gave)?0:gave) - (isNaN(left)?0:left);
    map[it.n] = { had: isNaN(had)?0:had, gave: isNaN(gave)?0:gave, left: isNaN(left)?0:left, sold };
  });
  return map;
}

let currentWeekLabel = '';

async function renderWeekView(){
  const monday = getMonday(weekAnchor);
  const sunday = addDays(monday, 6);
  currentWeekLabel =
    new Date(monday+'T00:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric'}) + ' – ' +
    new Date(sunday+'T00:00:00').toLocaleDateString('en-US',{month:'short', day:'numeric'});
  document.getElementById('weekLabel').textContent = currentWeekLabel;

  const dayList = document.getElementById('weekDayList');
  const summaryEl = document.getElementById('weekSummary');
  const catsEl = document.getElementById('weekCategories');
  dayList.innerHTML = '<div class="history-empty">Loading…</div>';
  summaryEl.innerHTML = '';
  catsEl.innerHTML = '';

  const week = {expected:0, collected:0, payroll:0};
  CATS.forEach(cat => { week[cat.key] = 0; });
  const rows = [];
  const weekItems = {}; // item name -> {had,gave,left,sold,sales}

  for (let i=0; i<7; i++){
    const d = addDays(monday, i);
    const data = await fetchDayData(d);
    const t = computeDayTotals(data);
    CATS.forEach(cat => { week[cat.key] += t[cat.key] || 0; });
    week.expected += t.expected;
    week.collected += (data && data.cashCollected) || 0;
    week.payroll += (data && data.shifts) ? data.shifts.reduce((s,x)=> s + (parseFloat(x.pay)||0), 0) : 0;
    rows.push({d, expected: t.expected, hasData: !!data});

    const detail = computeDayItemDetail(data);
    Object.keys(detail).forEach(name=>{
      const item = ITEMS.find(it => it.n === name);
      if (!item) return; // item may have since been removed from the catalog
      const dd = detail[name];
      if (!weekItems[name]) weekItems[name] = {had:0, gave:0, left:0, sold:0, sales:0};
      weekItems[name].had += dd.had;
      weekItems[name].gave += dd.gave;
      weekItems[name].left += dd.left;
      weekItems[name].sold += dd.sold;
      weekItems[name].sales += dd.sold * item.p;
    });
  }

  const missing = week.collected - week.expected;
  const missingClass = missing < 0 ? 'bad' : 'good';
  const missingLabel = missing < 0 ? 'Missing' : (missing > 0 ? 'Over' : 'Even');

  const catRows = CATS.map(cat => `
    <div class="srow"><span><span class="swatch" style="background:${cat.hex}"></span>${esc(cat.label)}</span><span class="num">${fmt(week[cat.key])}</span></div>
  `).join('');

  summaryEl.innerHTML = `
    <h2>Week Totals
      <span style="display:flex; gap:6px;">
        <button class="copy-btn" id="weekCopyBtn">Copy</button>
        <button class="copy-btn send-btn" id="weekSendBtn">Send ↗</button>
      </span>
    </h2>
    ${catRows}
    <div class="srow total"><span>Expected revenue</span><span class="num">${fmt(week.expected)}</span></div>
    <div class="srow"><span>Cash / card collected</span><span class="num">${fmt(week.collected)}</span></div>
    <div class="srow"><span>${missingLabel} / over</span><span class="num missing ${missingClass}">${fmt(Math.abs(missing))}</span></div>
    <div class="srow"><span>Payroll</span><span class="num">${fmt(week.payroll)}</span></div>
  `;

  // Per-item breakdown for the week, grouped by category, read-only (no inputs —
  // this is a summary across 7 days, not something you edit directly here).
  CATS.forEach(cat=>{
    const catItems = ITEMS.filter(it => it.c === cat.key && weekItems[it.n]);
    if (catItems.length === 0) return;

    const section = document.createElement('div');
    section.className = 'cat-section';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.style.background = cat.hex;
    head.style.color = contrastText(cat.hex);
    const catSales = catItems.reduce((sum, it) => sum + weekItems[it.n].sales, 0);
    head.innerHTML = `<span>${esc(cat.label)}</span><span class="tot num">${fmt(catSales)}</span>`;
    section.appendChild(head);

    const colHead = document.createElement('div');
    colHead.className = 'item-row head';
    colHead.innerHTML = `<div>Item</div><div style="text-align:center">Had</div><div style="text-align:center">Gave</div><div style="text-align:center">Left</div><div style="text-align:center">Sold</div><div style="text-align:right">Sales</div>`;
    section.appendChild(colHead);

    catItems.forEach(it=>{
      const w = weekItems[it.n];
      const row = document.createElement('div');
      row.className = 'item-row touched';
      const cellStyle = 'text-align:center; font-family:var(--mono); font-size:13px; padding:7px 2px;';
      row.innerHTML = `
        <div class="item-name">${esc(it.n)}<span class="item-price">${fmt(it.p)}</span></div>
        <div class="cell"><div style="${cellStyle}">${w.had}</div></div>
        <div class="cell"><div style="${cellStyle}">${w.gave}</div></div>
        <div class="cell"><div style="${cellStyle}">${w.left}</div></div>
        <div class="sold-val num">${w.sold}</div>
        <div class="sales-val num">${w.sold ? fmt(w.sales) : '—'}</div>
      `;
      section.appendChild(row);
    });

    catsEl.appendChild(section);
  });

  if (Object.keys(weekItems).length === 0){
    catsEl.innerHTML = '<div class="no-results">No items logged this week yet.</div>';
  }

  dayList.innerHTML = '';
  rows.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'history-row';
    const dObj = new Date(r.d + 'T00:00:00');
    row.innerHTML = `
      <div>
        <div class="history-date">${dObj.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'})}</div>
        <div class="history-sub">${r.hasData ? 'logged' : 'no entries'}</div>
      </div>
      <div class="history-amt"><div class="rev">${r.expected ? fmt(r.expected) : '—'}</div></div>
    `;
    row.addEventListener('click', ()=>{ switchView('sheet'); loadDay(r.d); });
    dayList.appendChild(row);
  });

  wireWeekShareButtons(weekItems, week, missingLabel);
}
