// Mirrors the daily buildSummaryText / buildSummaryHTML / buildSpreadsheetCapture,
// but sourced from the week's aggregated per-item totals instead of a single
// day's `counts`. Wired up fresh each time renderWeekView() runs.

function buildWeekSummaryText(weekItems, week, missingLabel){
  const lines = [`Week of ${currentWeekLabel}${activeStore ? ' — '+storeName(activeStore) : ''}`];

  const pad = (s, w) => String(s).padEnd(w, ' ');
  const padR = (s, w) => String(s).padStart(w, ' ');

  CATS.forEach(cat=>{
    const catItems = ITEMS.filter(it => it.c === cat.key && weekItems[it.n]);
    if (catItems.length === 0) return;
    const tableWidth = 16+1+4+1+4+1+4+1+4+1+9;
    lines.push('');
    lines.push(cat.label.toUpperCase());
    lines.push(`${pad('Item',16)} ${padR('Had',4)} ${padR('Gave',4)} ${padR('Left',4)} ${padR('Sold',4)} ${padR('Sales',9)}`);
    lines.push('-'.repeat(tableWidth));
    catItems.forEach((it, idx)=>{
      const w = weekItems[it.n];
      const name = it.n.length > 16 ? it.n.slice(0,15)+'…' : it.n;
      lines.push(`${pad(name,16)} ${padR(w.had,4)} ${padR(w.gave,4)} ${padR(w.left,4)} ${padR(w.sold,4)} ${padR(w.sold?fmt(w.sales):fmt(0),9)}`);
      if (idx < catItems.length - 1) lines.push('-'.repeat(tableWidth));
    });
    lines.push('-'.repeat(tableWidth));
  });

  lines.push('');
  lines.push('TOTALS');
  const totalsLabelW = 18, totalsValW = 10;
  const totalRow = (label, value) => lines.push(`${pad(label, totalsLabelW)} ${padR(value, totalsValW)}`);
  lines.push('-'.repeat(totalsLabelW + 1 + totalsValW));
  CATS.forEach(cat => totalRow(cat.label, fmt(week[cat.key])));
  totalRow('Expected', fmt(week.expected));
  totalRow('Collected', fmt(week.collected));
  totalRow(missingLabel, fmt(Math.abs(week.collected - week.expected)));
  if (week.payroll) totalRow('Payroll', fmt(week.payroll));

  return lines.join('\n');
}

function buildWeekSummaryHTML(weekItems, week, missingLabel){
  const cellStyle = 'border:1px solid #ccc; padding:4px 8px; font-family:sans-serif; font-size:13px;';
  const parts = [`<div style="font-family:sans-serif; font-size:14px; color:#171310;">`];
  parts.push(`<div style="font-weight:700; margin-bottom:10px;">Week of ${esc(currentWeekLabel)}${activeStore ? ' — '+esc(storeName(activeStore)) : ''}</div>`);

  CATS.forEach(cat=>{
    const catItems = ITEMS.filter(it => it.c === cat.key && weekItems[it.n]);
    if (catItems.length === 0) return;
    const hex = cat.hex;
    parts.push(`<div style="font-weight:800; color:${hex}; margin:14px 0 4px; text-transform:uppercase; font-size:12px; letter-spacing:.04em;">${esc(cat.label)}</div>`);
    parts.push(`<table style="border-collapse:collapse; width:100%; margin-bottom:4px;">`);
    parts.push(`<tr style="background:${hex}; color:${contrastText(hex)};">
      <th style="${cellStyle} text-align:left;">Item</th>
      <th style="${cellStyle} text-align:center;">Had</th>
      <th style="${cellStyle} text-align:center;">Gave</th>
      <th style="${cellStyle} text-align:center;">Left</th>
      <th style="${cellStyle} text-align:center;">Sold</th>
      <th style="${cellStyle} text-align:right;">Sales</th>
    </tr>`);
    catItems.forEach(it=>{
      const w = weekItems[it.n];
      parts.push(`<tr>
        <td style="${cellStyle} font-weight:600;">${esc(it.n)}</td>
        <td style="${cellStyle} text-align:center;">${w.had}</td>
        <td style="${cellStyle} text-align:center;">${w.gave}</td>
        <td style="${cellStyle} text-align:center;">${w.left}</td>
        <td style="${cellStyle} text-align:center;">${w.sold}</td>
        <td style="${cellStyle} text-align:right; font-weight:700;">${w.sold ? fmt(w.sales) : fmt(0)}</td>
      </tr>`);
    });
    parts.push(`</table>`);
  });

  parts.push(`<table style="border-collapse:collapse; width:100%; margin-top:10px;">`);
  CATS.forEach(cat=>{
    parts.push(`<tr><td style="${cellStyle} font-weight:700; color:${cat.hex};">${esc(cat.label)}</td><td style="${cellStyle} text-align:right;">${fmt(week[cat.key])}</td></tr>`);
  });
  parts.push(`<tr><td style="${cellStyle} font-weight:700;">Expected</td><td style="${cellStyle} text-align:right; font-weight:700;">${fmt(week.expected)}</td></tr>`);
  parts.push(`<tr><td style="${cellStyle}">Collected</td><td style="${cellStyle} text-align:right;">${fmt(week.collected)}</td></tr>`);
  const missing = week.collected - week.expected;
  const missColor = missing < 0 ? '#b3401f' : '#2f8f5b';
  parts.push(`<tr><td style="${cellStyle} font-weight:700; color:${missColor};">${esc(missingLabel)}</td><td style="${cellStyle} text-align:right; font-weight:700; color:${missColor};">${fmt(Math.abs(missing))}</td></tr>`);
  if (week.payroll) parts.push(`<tr><td style="${cellStyle} font-weight:700;">Payroll</td><td style="${cellStyle} text-align:right;">${fmt(week.payroll)}</td></tr>`);
  parts.push(`</table></div>`);
  return parts.join('');
}

function buildWeekSpreadsheetCapture(weekItems, week, missingLabel){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#111; background:#fff; width:900px;';

  const topBar = document.createElement('div');
  topBar.style.cssText = 'background:#1B2432; height:16px;';
  wrap.appendChild(topBar);

  const dateRow = document.createElement('table');
  dateRow.style.cssText = 'border-collapse:collapse; width:100%; margin:6px 0;';
  dateRow.innerHTML = `<tr>
    <td style="padding:4px 10px; font-weight:700; width:120px;">Week</td>
    <td style="padding:4px 10px;">${esc(currentWeekLabel)}${activeStore ? ' (' + esc(storeName(activeStore)) + ')' : ''}</td>
  </tr>`;
  wrap.appendChild(dateRow);

  const table = document.createElement('table');
  table.style.cssText = 'border-collapse:collapse; width:100%; table-layout:fixed;';
  const cols   = ['ITEM','Unit Price','Had','Gave','Left','Sold','Sales','Category'];
  const widths = ['24%','12%','8%','8%','8%','8%','12%','20%'];
  const aligns = ['left','right','center','center','center','center','right','left'];
  let html = '<colgroup>' + widths.map(w => `<col style="width:${w}">`).join('') + '</colgroup>';
  html += '<tr>' + cols.map((c,i) =>
    `<th style="background:#2554E0; color:#fff; font-weight:700; padding:6px 8px; border:1px solid #999; text-align:${aligns[i]};">${c}</th>`
  ).join('') + '</tr>';

  ITEMS.forEach(it=>{
    const itCat = catByKey(it.c);
    const bg = itCat ? itCat.brightHex : '#eee';
    const w = weekItems[it.n];
    const catLabel = itCat ? itCat.label : it.c;
    html += `<tr>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999;">${esc(it.n)}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:right;">${fmt(it.p)}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${w ? w.had : ''}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${w ? w.gave : ''}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${w ? w.left : ''}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:center;">${w ? w.sold : ''}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999; text-align:right;">${w ? fmt(w.sales) : ''}</td>
      <td style="background:${bg}; padding:5px 8px; border:1px solid #999;">${esc(catLabel)}</td>
    </tr>`;
  });
  table.innerHTML = html;
  wrap.appendChild(table);

  const spacer1 = document.createElement('div'); spacer1.style.height = '16px'; wrap.appendChild(spacer1);

  const totalsHeader = document.createElement('div');
  totalsHeader.style.cssText = 'background:#1B2432; color:#fff; font-weight:700; text-align:center; padding:6px; border:1px solid #999;';
  totalsHeader.textContent = 'WEEK TOTALS / CASH & CARD CHECK';
  wrap.appendChild(totalsHeader);

  const missing = week.collected - week.expected;
  const isNeg = missing < 0;
  const totalRows = [
    ...CATS.map(cat => ({ label: cat.label.toUpperCase() + ' TOTAL SALES', value: fmt(week[cat.key]), bg: cat.brightHex })),
    { label:'EXPECTED REVENUE',    value: fmt(week.expected),  bg:'#e6e6e6' },
    { label:'CASH/CARD COLLECTED', value: fmt(week.collected), bg:'#e6e6e6' },
    { label:'MISSING / OVER',      value: (isNeg?'-':'') + fmt(Math.abs(missing)), bg: isNeg ? '#f8b4b4' : '#c8f0c8' },
  ];
  if (week.payroll) totalRows.push({ label:'PAYROLL', value: fmt(week.payroll), bg:'#e6e6e6' });

  const totalsTable = document.createElement('table');
  totalsTable.style.cssText = 'border-collapse:collapse; width:100%;';
  totalsTable.innerHTML = totalRows.map(r => `<tr>
    <td style="background:${r.bg}; font-weight:700; padding:5px 8px; border:1px solid #999; width:60%;">${r.label}</td>
    <td style="padding:5px 8px; border:1px solid #999; text-align:right;">${r.value}</td>
  </tr>`).join('');
  wrap.appendChild(totalsTable);

  return wrap;
}

async function captureWeekSheetImage(weekItems, week, missingLabel){
  if (typeof html2canvas === 'undefined') return null;
  const root = buildWeekSpreadsheetCapture(weekItems, week, missingLabel);
  root.style.position = 'fixed';
  root.style.left = '-9999px';
  root.style.top = '0';
  document.body.appendChild(root);
  try{
    await new Promise(r => setTimeout(r, 30));
    return await html2canvas(root, { backgroundColor: '#f3ede2', scale: 2 });
  }catch(err){
    console.error('week capture failed', err);
    return null;
  }finally{
    root.remove();
  }
}

function wireWeekShareButtons(weekItems, week, missingLabel){
  const copyBtn = document.getElementById('weekCopyBtn');
  const sendBtn = document.getElementById('weekSendBtn');
  if (!copyBtn || !sendBtn) return;

  copyBtn.addEventListener('click', ()=>{
    copyRichText(buildWeekSummaryText(weekItems, week, missingLabel), buildWeekSummaryHTML(weekItems, week, missingLabel))
      .then(ok => showToast(ok ? 'Week summary copied (with colors — paste into Gmail, Notes, Docs, etc.)' : 'Could not copy — see box below'));
  });

  sendBtn.addEventListener('click', async ()=>{
    const title = `Week Summary — ${currentWeekLabel}`;
    const filename = `week-sheet-${weekAnchor}.png`;

    let blob = null;
    try{
      const canvas = await captureWeekSheetImage(weekItems, week, missingLabel);
      if (canvas) blob = await canvasToBlob(canvas);
    }catch(err){ console.error('week image generation failed', err); }

    if (blob){
      const file = new File([blob], filename, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ title, files: [file] });
          return;
        }catch(err){
          if (err && err.name === 'AbortError') return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      showToast('Image downloaded');
      return;
    }

    // Fallback to plain text share if image generation failed entirely.
    const text = buildWeekSummaryText(weekItems, week, missingLabel);
    if (navigator.share){
      try{ await navigator.share({ title, text }); return; }
      catch(err){ if (err && err.name === 'AbortError') return; }
    }
    const copied = await copyText(text);
    if (copied){ showToast('Sharing isn\'t available here — copied instead'); }
    else { showShareModal(text); }
  });
}

async function saveStoresMeta(){
  try{
    localStorage.setItem('stores', JSON.stringify(stores));
    localStorage.setItem('activeStore', activeStore);
  }catch(err){ console.error('could not save store list', err); }

  if (!cloudEnabled) return;
  try{
    const rows = stores.map(s => ({ id: s.id, name: s.name, updated_at: new Date().toISOString() }));
    const { error } = await sb.from('ledger_stores').upsert(rows, { onConflict: 'id' });
    if (error) throw error;
  }catch(err){ console.error('cloud store save failed', err); }
}

async function pullStoresFromCloud(){
  if (!cloudEnabled) return false;
  try{
    const { data, error } = await sb.from('ledger_stores').select('id,name').order('name');
    if (error) throw error;
    if (data && data.length){
      stores = data.map(r => ({id: r.id, name: r.name}));
      localStorage.setItem('stores', JSON.stringify(stores));
      return true;
    }
  }catch(err){ console.error('cloud store fetch failed', err); }
  return false;
}

function subscribeToStoreChanges(){
  if (!cloudEnabled) return;
  if (storesChannel) sb.removeChannel(storesChannel);
  storesChannel = sb.channel('ledger_stores_all')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ledger_stores' }, async () => {
      const changed = await pullStoresFromCloud();
      if (changed){ renderStoreTabs(); }
    })
    .subscribe();
}

// ===================== ITEM CATALOG (products / rows) =====================
// The product list is shared across all stores, synced the same way the store
// list is: local cache for offline use, cloud table as source of truth, and a
// realtime subscription so a product added on one device shows up everywhere.
let itemsChannel = null;

function itemsToCloudRows(){
  return ITEMS.map(it => ({ name: it.n, price: it.p, category: it.c, updated_at: new Date().toISOString() }));
}

async function saveItemsCatalog(){
  try{ localStorage.setItem('items', JSON.stringify(ITEMS)); }catch(err){ console.error('could not cache items locally', err); }
  if (!cloudEnabled) return;
  try{
    const { error } = await sb.from('ledger_items').upsert(itemsToCloudRows(), { onConflict: 'name' });
    if (error) throw error;
  }catch(err){ console.error('cloud item save failed', err); }
}

async function pullItemsFromCloud(){
  if (!cloudEnabled) return false;
  try{
    const { data, error } = await sb.from('ledger_items').select('name,price,category').order('name');
    if (error) throw error;
    if (data && data.length){
      ITEMS = data.map(r => ({ n: r.name, p: parseFloat(r.price), c: r.category }));
      localStorage.setItem('items', JSON.stringify(ITEMS));
      return true;
    }
  }catch(err){ console.error('cloud item fetch failed', err); }
  return false;
}

// First-ever run: if the cloud table is empty, seed it with the built-in
// default catalog so every device converges on the same starting list.
async function seedCloudItemsIfEmpty(){
  if (!cloudEnabled) return;
  try{
    const { data, error } = await sb.from('ledger_items').select('name').limit(1);
    if (error) throw error;
    if (!data || data.length === 0){
      await sb.from('ledger_items').upsert(itemsToCloudRows(), { onConflict: 'name' });
    }
  }catch(err){ console.error('could not seed cloud items', err); }
}

function subscribeToItemChanges(){
  if (!cloudEnabled) return;
  if (itemsChannel) sb.removeChannel(itemsChannel);
  itemsChannel = sb.channel('ledger_items_all')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ledger_items' }, async () => {
      const changed = await pullItemsFromCloud();
      if (changed){
        renderTabs();
        renderCategories();
        renderSummary();
        if (currentView === 'week') renderWeekView();
        if (currentView === 'history') renderHistory();
      }
    })
    .subscribe();
}

function itemNameTaken(name){
  return ITEMS.some(it => it.n.trim().toLowerCase() === name.trim().toLowerCase());
}

async function addItem(name, price, category){
  ITEMS.push({ n: name, p: price, c: category });
  await saveItemsCatalog();
  renderTabs();
  renderCategories();
  renderSummary();
}

async function removeItem(name){
  ITEMS = ITEMS.filter(it => it.n !== name);
  try{ localStorage.setItem('items', JSON.stringify(ITEMS)); }catch(err){}
  if (cloudEnabled){
    try{
      const { error } = await sb.from('ledger_items').delete().eq('name', name);
      if (error) throw error;
    }catch(err){ console.error('cloud item delete failed', err); }
  }
  renderTabs();
  renderCategories();
  renderSummary();
}

function subscribeToCategoryChanges(){

function openPriceEditModal(){
  const list = document.getElementById('priceEditList');
  list.innerHTML = '';

  CATS.forEach(cat=>{

    header.textContent = cat.label;
    list.appendChild(header);

    catItems.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'price-edit-row';
      row.innerHTML = `
        <span class="name">${esc(it.n)}</span>
        <input type="text" inputmode="decimal" autocomplete="off" data-price-item="${esc(it.n)}" value="${it.p}">
      `;
      list.appendChild(row);
    });
  });

  list.querySelectorAll('input[data-price-item]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const clean = sanitizeAmount(e.target.value);
      if (clean !== e.target.value) e.target.value = clean;

document.getElementById('priceEditCancel').addEventListener('click', ()=>{
  document.getElementById('priceEditModal').classList.remove('show');
});

document.getElementById('priceEditSave').addEventListener('click', async ()=>{
  const inputs = document.querySelectorAll('#priceEditList input[data-price-item]');
  let changedCount = 0;
  let hadInvalid = false;

  inputs.forEach(inp=>{
    const name = inp.dataset.priceItem;
    const raw = inp.value.trim();
    const newPrice = parseFloat(raw);
    if (!raw || isNaN(newPrice) || newPrice <= 0){ hadInvalid = true; return; }
    const item = ITEMS.find(it => it.n === name);
    if (item && item.p !== newPrice){
      item.p = newPrice;
      changedCount++;
    }
  });

  if (hadInvalid){
    showToast('Some prices were left blank/invalid — those were skipped');
  }

  document.getElementById('priceEditModal').classList.remove('show');

  if (changedCount > 0){
    await saveItemsCatalog();
    renderTabs();
    renderCategories();
    renderSummary();
    showToast(`Updated ${changedCount} price${changedCount === 1 ? '' : 's'}`);
  } else if (!hadInvalid){
    showToast('No changes made');
  }
});

// migrate data saved before multi-store support existed (bare 'day:YYYY-MM-DD' keys)
async function migrateLegacyData(){
  try{
    const legacyKeys = Object.keys(localStorage).filter(k => /^day:\d{4}-\d{2}-\d{2}$/.test(k));
    if (legacyKeys.length === 0) return false;

    let legacyName = 'Store 1';
    try{
      const savedStore = localStorage.getItem('store');
      if (savedStore) legacyName = savedStore;
    }catch(err){ /* no legacy store name saved */ }

    const id = slugify(legacyName);
    stores = [{id, name: legacyName}];
    activeStore = id;

    for (const k of legacyKeys){
      const date = k.replace('day:','');
      const raw = localStorage.getItem(k);
      if (raw){
        localStorage.setItem('day:' + id + ':' + date, raw);
      }
      try{ localStorage.removeItem(k); }catch(err){ /* best effort cleanup */ }
    }
    await saveStoresMeta();
    return true;
  }catch(err){
    console.error('migration failed', err);
    return false;
  }
}

async function init(){
  const picker = document.getElementById('datePicker');
  picker.value = currentDate;
  picker.addEventListener('change', e=>{
    if (e.target.value) loadDay(e.target.value);
  });

  try{
    const savedStores = localStorage.getItem('stores');
    if (savedStores) stores = JSON.parse(savedStores);
  }catch(err){ /* no stores saved yet */ }

  try{
    const savedItems = localStorage.getItem('items');
    if (savedItems) ITEMS = JSON.parse(savedItems);
  }catch(err){ /* no item cache yet, default catalog stays in place */ }

  try{
    const savedCategories = localStorage.getItem('categories');
    if (savedCategories) CATS = JSON.parse(savedCategories);
  }catch(err){ /* no category cache yet, default four stay in place */ }

  if (cloudEnabled){
    await pullStoresFromCloud();
    subscribeToStoreChanges();
    await seedCloudItemsIfEmpty();
    await pullItemsFromCloud();
    subscribeToItemChanges();
    await seedCloudCategoriesIfEmpty();
    await pullCategoriesFromCloud();
    subscribeToCategoryChanges();
  }

  if (!stores || stores.length === 0){
    await migrateLegacyData();
  }

  if (!stores || stores.length === 0){
    const id = slugify('Store 1');
    stores = [{id, name:'Store 1'}];
    activeStore = id;
    await saveStoresMeta();
  }

  if (!activeStore){
    try{
      const savedActive = localStorage.getItem('activeStore');
      activeStore = (savedActive && stores.some(s => s.id === savedActive)) ? savedActive : stores[0].id;
    }catch(err){
      activeStore = stores[0].id;
    }
  }

  renderStoreTabs();
  await preloadSavedDates();
  await loadDay(currentDate);

  // support manifest shortcuts: ?view=sheet | week | history
  const params = new URLSearchParams(location.search);
  const requestedView = params.get('view');
  if (requestedView === 'week' || requestedView === 'history'){
    switchView(requestedView);
  }
}

init();
